# These substitutions allow the end user to override certain values
substitutions:
  name: "autobatchdoser"
  friendly_name: "AutoBatchDoser"

esphome:
  name: "${name}"
  # Friendly names are used where appropriate in Home Assistant
  friendly_name: "${friendly_name}"
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  name_add_mac_suffix: true

  # This will allow for (future) project identification,
  # configuration and updates.
  project:
    name: chill-division.autobatchdoser
    version: "2.0"

  # This automation runs once when the ESP boots up
  # It sets the initial state of the direction text sensors
  # based on the initial state of the direction switches.
  # Higher priority ensures it runs early.
  on_boot:
    priority: 600  # Default priority is 0. Higher runs earlier.
    then:
      - lambda: |-
          // Motor 1
          if (id(motor_1_direction).state) {
            id(motor_1_direction_text).publish_state("Forward");
          } else {
            id(motor_1_direction_text).publish_state("Reverse");
          }
          // Motor 2
          if (id(motor_2_direction).state) {
            id(motor_2_direction_text).publish_state("Forward");
          } else {
            id(motor_2_direction_text).publish_state("Reverse");
          }
          // Motor 3
          if (id(motor_3_direction).state) {
            id(motor_3_direction_text).publish_state("Forward");
          } else {
            id(motor_3_direction_text).publish_state("Reverse");
          }
          // Motor 4
          if (id(motor_4_direction).state) {
            id(motor_4_direction_text).publish_state("Forward");
          } else {
            id(motor_4_direction_text).publish_state("Reverse");
          }
          // Motor 5
          if (id(motor_5_direction).state) {
            id(motor_5_direction_text).publish_state("Forward");
          } else {
            id(motor_5_direction_text).publish_state("Reverse");
          }
          // Motor 6
          if (id(motor_6_direction).state) {
            id(motor_6_direction_text).publish_state("Forward");
          } else {
            id(motor_6_direction_text).publish_state("Reverse");
          }
      # The doser only announces its firmware version when it powers up, which
      # is usually before we're listening, so ask for it once we're running.
      - delay: 5s
      - uart.write:
          id: uart_bus
          data: "VERSION\n"


esp32:
  # Using the generic P4 board target
  board: esp32-p4
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SPIRAM: y
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_SPIRAM_SPEED_80M: y
  # Matches the M5Stack hardware spec for primary CPU
  cpu_frequency: 360MHz
  flash_size: 16MB

# To be able to get logs from the device via serial and api.
logger:

# API is a requirement of the dashboard import.
api:

# OTA is required for Over-the-Air updating
ota:
  platform: esphome

# This should point to the public location of this yaml file.
dashboard_import:
  package_import_url: github://Chill-Division/autobatchdoser/autobatchdoser.yaml@v2
  import_full_config: true

# Network interface for Unit PoE P4
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  phy_addr: 1
  power_pin: GPIO51
  clk:
    pin: 50
    mode: CLK_EXT_IN

web_server:
  port: 80

# Setup the UART bus
uart:
  id: uart_bus
  tx_pin: 53
  rx_pin: 54 
  baud_rate: 115200 


# Speeds are restored after a reboot, so calibration isn't lost
number:
  - platform: template
    name: "Motor 1 Speed"
    id: motor_1_speed
    optimistic: true
    min_value: 400
    max_value: 2500
    step: 10
    initial_value: 1700
    restore_value: true
  - platform: template
    name: "Motor 2 Speed"
