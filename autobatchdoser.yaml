    name: "Motor 1 Calibrate"
    on_press:
      - uart.write:
          id: uart_bus
          data: !lambda |-
            std::string s = "Motor 1 CALIBRATE " + std::to_string((int)id(motor_1_speed).state) + "\n";
            return std::vector<unsigned char>(s.begin(), s.end());
